# Render Blueprint - 한국고전소설DB 배포 정의
# 리포를 Render에 연결한 뒤 Blueprint로 배포하면 아래 3개 리소스가 함께 생성된다.
#   1) classic-literature-db   : PostgreSQL 데이터베이스
#   2) classic-literature-api  : FastAPI 백엔드 (Web Service)
#   3) classic-literature-web  : Vite 프론트엔드 (Static Site)
# 시크릿(OPENAI_API_KEY)과 상호참조 값(프론트 API URL, 백엔드 CORS)은
# 첫 배포 후 대시보드에서 채운다.

databases:
  - name: classic-literature-db
    databaseName: classic_literature
    plan: free

services:
  # -- 백엔드: FastAPI (Web Service) --
  - type: web
    name: classic-literature-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: classic-literature-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # -- 프론트: Vite (Static Site) --
  - type: web
    name: classic-literature-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
