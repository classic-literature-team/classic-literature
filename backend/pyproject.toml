[project]
name = "classic-literature-backend"
version = "0.1.0"
description = "Classic Literature backend (FastAPI + OpenAI Agents SDK)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# 프롬프트(instructions) 문자열은 길 수밖에 없어 해당 파일만 줄길이(E501) 예외.
[tool.ruff.lint.per-file-ignores]
"app/agents/literature_agent.py" = ["E501"]

# FastAPI 의존성 주입은 인자 기본값에서 Depends()/Query() 등을 호출하는 것이 표준 패턴이다.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
