name: PR Check

on:
  pull_request:
    branches: [main]
  # main으로 push될 때도 검증 (머지 후 회귀 방지)
  push:
    branches: [main]

# 같은 PR에서 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / format / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Type check & build
        run: npm run build

  backend:
    name: Backend (ruff / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app

      - name: Ruff (format check)
        run: ruff format --check app

      - name: Pytest
        # exit code 5 = 수집된 테스트 없음. 테스트가 아직 없어도 잡을 실패시키지 않는다.
        run: |
          code=0
          pytest || code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet - skipping."
            exit 0
          fi
          exit "$code"
